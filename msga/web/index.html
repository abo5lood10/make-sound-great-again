<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Make Sound Great Again</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <button id="gear" class="icon-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <i id="gearDot" class="dot" hidden></i>
  </button>
</header>

<nav id="tabs" class="tabs">
  <div class="seg" id="tabSeg"><button data-v="main" data-i18n="tab_enhance"></button><button data-v="player" data-i18n="tab_player"></button></div>
</nav>

<!-- ===== الصفحة الرئيسية ===== -->
<main id="main" class="view">
  <div class="brand">
    <img src="/static/icon.svg" alt="" width="56" height="56">
    <h1 class="wordmark" dir="ltr">Make Sound Great Again</h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>

  <div id="banner" class="notice" hidden></div>
  <div id="updBanner" class="notice upd" hidden><span id="updBannerText"></span> <button id="updBannerGo" class="link" data-i18n="open_settings"></button></div>

  <section class="card pad">
    <textarea id="urls" rows="3" dir="ltr" spellcheck="false" data-i18n-ph="url_placeholder"></textarea>
    <div class="sub url-hint" data-i18n="url_hint"></div>
    <div class="paste-row"><button id="pasteBtn" class="link" data-i18n="paste_link"></button><span id="pasteHint" class="sub"></span></div>
  </section>

  <div id="drop" class="drop" tabindex="0" role="button">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    <div id="dropTitle"></div>
    <div id="dropSub" class="sub"></div>
  </div>
  <input type="file" id="files" multiple accept="audio/*,video/*" hidden>
  <input type="file" id="folderInput" webkitdirectory multiple hidden>
  <div class="pick-row"><button id="pickFiles" class="tint" data-i18n="pick_files"></button><button id="pickFolder" class="tint" data-i18n="pick_folder"></button></div>
  <button id="clearFiles" class="link" hidden></button>

  <section class="card group">
    <div class="row"><span data-i18n="preset"></span>
      <select id="preset"></select></div>
    <div class="row"><span data-i18n="format"></span>
      <select id="format"></select></div>
    <div class="row"><span data-i18n="jobs"></span>
      <div class="seg stepper"><button id="jobsMinus" aria-label="-">−</button><span id="jobsVal">1</span><button id="jobsPlus" aria-label="+">+</button></div></div>
    <div class="row"><span data-i18n="playlist"></span>
      <label class="switch"><input type="checkbox" id="playlist"><i></i></label></div>
  </section>

  <details id="tune" class="card group tune">
    <summary data-i18n="fine_tune"></summary>
    <div class="row"><span data-i18n="bass"></span>
      <div class="slider"><input type="range" id="bass" min="-6" max="6" step="1" value="0"><output id="bassVal">0</output></div></div>
    <div class="row"><span data-i18n="treble"></span>
      <div class="slider"><input type="range" id="treble" min="-6" max="6" step="1" value="0"><output id="trebleVal">0</output></div></div>
    <div class="row"><div><span data-i18n="lufs_label"></span><div class="sub" data-i18n="lufs_hint"></div></div>
      <select id="lufs"></select></div>
  </details>
  <button id="saveDefaults" class="link" data-i18n="save_defaults"></button>

  <button id="go" class="primary" data-i18n="go"></button>
  <div id="formErr" class="err"></div>

  <div class="results-head">
    <h2 data-i18n="results"></h2>
    <span class="links">
      <button id="clearList" class="link" data-i18n="clear_list"></button>
      <button id="cleanOld" class="link" data-i18n="clean_old"></button>
      <button id="openFolder" class="link" data-i18n="open_folder"></button>
    </span>
  </div>
  <div id="cleanBox" class="card pad inline" hidden>
    <span data-i18n="clean_prompt"></span>
    <input type="number" id="cleanDays" value="30" min="0" max="3650" class="num">
    <button id="cleanGo" class="tint" data-i18n="delete"></button>
    <button id="cleanCancel" class="link" data-i18n="cancel"></button>
  </div>
  <div id="empty" class="empty"><svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg><div data-i18n="empty"></div></div>
  <div id="list"></div>
  <p id="outInfo" class="sub path"></p>
</main>

<!-- ===== المشغّل ===== -->
<main id="player" class="view" hidden>
  <section class="card pad now">
    <div class="np">
      <div class="np-art"><img id="npCover" alt="" hidden><div id="npIcon" class="np-icon">♪</div></div>
      <div class="np-text"><div id="npTitle" class="np-title"></div><div id="npArtist" class="sub"></div></div>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="seek">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="ctrls">
      <button id="btnShuffle" class="ctl" aria-label="shuffle">🔀</button>
      <button id="btnPrev" class="ctl big" aria-label="previous">⏮</button>
      <button id="btnPlay" class="play-btn" aria-label="play">▶</button>
      <button id="btnNext" class="ctl big" aria-label="next">⏭</button>
      <button id="btnRepeat" class="ctl" aria-label="repeat">🔁</button>
    </div>
    <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="volume"></div>
  </section>
  <div class="pick-row"><button id="plFiles" class="tint" data-i18n="pl_files"></button><button id="plFolder" class="tint" data-i18n="pl_folder"></button><button id="plClear" class="link" data-i18n="pl_clear"></button></div>
  <input type="file" id="plInput" multiple accept="audio/*,video/*" hidden>
  <div id="plEmpty" class="empty"><div data-i18n="pl_empty"></div><div class="sub" data-i18n="pl_formats"></div></div>
  <ol id="queue" class="queue"></ol>
  <audio id="audio" preload="auto"></audio>
</main>

<!-- ===== الإعدادات ===== -->
<main id="settings" class="view" hidden>
  <button id="back" class="link back"></button>
  <h1 class="page-title" data-i18n="settings"></h1>

  <section class="card group">
    <div class="row"><span data-i18n="language"></span>
      <div class="seg" id="langSeg"><button data-v="ar">العربية</button><button data-v="en">English</button></div></div>
    <div class="row"><span data-i18n="appearance"></span>
      <div class="seg" id="themeSeg"><button data-v="system" data-i18n="th_system"></button><button data-v="light" data-i18n="th_light"></button><button data-v="dark" data-i18n="th_dark"></button></div></div>
    <div class="row"><div><span data-i18n="light_mode"></span><div class="sub" data-i18n="light_hint"></div></div>
      <label class="switch"><input type="checkbox" id="lightMode"><i></i></label></div>
    <div class="row"><div><span data-i18n="keep_orig_label"></span><div class="sub" data-i18n="keep_orig_hint"></div></div>
      <label class="switch"><input type="checkbox" id="keepOrig"><i></i></label></div>
    <div class="row"><div><span data-i18n="notify_label"></span><div class="sub" data-i18n="notify_hint"></div></div>
      <label class="switch"><input type="checkbox" id="notifyOn"><i></i></label></div>
  </section>

  <section class="card group">
    <div class="row col"><span data-i18n="out_folder"></span>
      <div class="inline"><input id="outPath" dir="ltr" spellcheck="false"><button id="outSave" class="tint" data-i18n="save"></button></div>
    </div>
    <div class="row"><div><span data-i18n="ar_font"></span><div class="sub" id="fontStatus"></div></div></div>
  </section>

  <section class="card group">
    <div class="row"><div><span data-i18n="watch_label"></span><div class="sub" data-i18n="watch_hint"></div></div>
      <label class="switch"><input type="checkbox" id="watchOn"><i></i></label></div>
    <div class="row col"><div class="inline"><input id="watchPath" dir="ltr" spellcheck="false">
      <button id="watchPick" class="tint" data-i18n="choose"></button><button id="watchSave" class="tint" data-i18n="save"></button></div></div>
  </section>

  <section class="card group">
    <div class="row"><div><span data-i18n="about"></span><div class="sub" id="aboutLine"></div></div>
      <button id="repoLink" class="link">GitHub ↗</button></div>
    <div class="row"><div><span data-i18n="auto_check"></span></div>
      <label class="switch"><input type="checkbox" id="autoCheck"><i></i></label></div>
    <div class="row"><div><span data-i18n="updates"></span><div class="sub" id="updStatus"></div></div>
      <button id="updCheck" class="tint" data-i18n="check_updates"></button></div>
    <div class="row col" id="updProgRow" hidden><div class="bar-track"><i id="updProgBar"></i></div></div>
    <div class="row" id="updRow" hidden><div><span id="updTitle"></span></div>
      <button id="updApply" class="primary small" hidden></button>
      <button id="updReleases" class="primary small" hidden data-i18n="open_releases"></button>
      <button id="updRestart" class="primary small" hidden data-i18n="restart"></button></div>
    <div class="row"><div><span data-i18n="engine"></span><div class="sub" id="engStatus"></div></div>
      <button id="engUpdate" class="tint" data-i18n="update_engine"></button></div>
  </section>

  <button id="quit" class="link danger" data-i18n="quit" hidden></button>
</main>

<script src="/static/app.js"></script>
</body>
</html>
