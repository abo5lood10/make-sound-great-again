name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}   # ماك للفحص فقط، وخوادمه أحيانًا ما تتوفر
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Show tool versions
        run: |
          ffmpeg -version
          python -m yt_dlp --version
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Open the real app window (Windows / macOS only)
        if: runner.os != 'Linux'
        continue-on-error: true   # معلومات فقط: بيئة CI ممكن ما فيها شاشة كاملة
        run: python run.py --selftest
