name: Release

# شغّله بدفع وسم إصدار:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, sep: ";", icon: assets/icon.ico, bundle_ffmpeg: true }
          - { name: macos, os: macos-latest, sep: ":", icon: assets/icon.icns, bundle_ffmpeg: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build requirements
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Bundle ffmpeg (Windows, LGPL build, checksum verified)
        if: matrix.bundle_ffmpeg
        shell: pwsh
        run: |
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          $zip = "ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest "$base/$zip" -OutFile $zip
          Invoke-WebRequest "$base/checksums.sha256" -OutFile checksums.sha256
          $expected = ((Select-String -Path checksums.sha256 -Pattern ([regex]::Escape($zip)) | Select-Object -First 1).Line -split "\s+")[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($expected.ToLower() -ne $actual.ToLower()) { throw "ffmpeg checksum mismatch" }
          Expand-Archive $zip -DestinationPath ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName bin/
          $enc = & bin/ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String
          foreach ($name in "libmp3lame", "libopus", "flac", " aac ") { if ($enc -notmatch $name) { throw "bundled ffmpeg lacks encoder: $name" } }
      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ -d bin ]; then EXTRA="--add-data bin${{ matrix.sep }}bin"; fi
          pyinstaller --noconfirm --windowed --name "Make Sound Great Again" \
            --icon "${{ matrix.icon }}" \
            --add-data "msga/web${{ matrix.sep }}msga/web" \
            --add-data "assets${{ matrix.sep }}assets" \
            --add-data "THIRD_PARTY.md${{ matrix.sep }}." \
            --collect-all yt_dlp \
            $EXTRA \
            run.py
      - name: Smoke test (the built app must start and answer)
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            BIN="dist/Make Sound Great Again.app/Contents/MacOS/Make Sound Great Again"
          else
            BIN="dist/Make Sound Great Again/Make Sound Great Again.exe"
          fi
          export MSGA_HOME="$RUNNER_TEMP/msga_home"
          "$BIN" --no-open > /dev/null 2>&1 &
          UP=0
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8765/api/ping; then UP=1; break; fi
            sleep 1
          done
          if [ "$UP" != "1" ]; then echo "app did not start"; cat "$MSGA_HOME/app.log" 2>/dev/null; exit 1; fi
          echo " <- app is up"
          STATE=$(curl -fs http://127.0.0.1:8765/api/state)
          echo "$STATE" | python -c "import json,sys; d=json.load(sys.stdin); print('missing tools:', d['missing'])"
          if [ "${{ matrix.bundle_ffmpeg }}" = "true" ]; then
            echo "$STATE" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(1 if d['missing'] else 0)" || { echo "bundled build is missing tools"; exit 1; }
          fi
          curl -fs -X POST -d '{}' http://127.0.0.1:8765/api/quit || true
          sleep 2
          # فحص النافذة الحقيقية من داخل النسخة المجمّعة (exit code فقط، لأن النسخة بدون طرفية)
          python - "$BIN" <<'PY' || { echo "window selftest FAILED"; cat "$MSGA_HOME/app.log" 2>/dev/null; exit 1; }
          import subprocess, sys
          try:
              sys.exit(subprocess.run([sys.argv[1], "--selftest"], timeout=150).returncode)
          except subprocess.TimeoutExpired:
              print("selftest timed out")
              sys.exit(1)
          PY
          echo "window selftest OK"
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.name }}" = "macos" ]; then
            ditto -c -k --keepParent "dist/Make Sound Great Again.app" "out/Make-Sound-Great-Again-macos.zip"
          else
            powershell -Command "Compress-Archive -Path 'dist/Make Sound Great Again' -DestinationPath 'out/Make-Sound-Great-Again-windows.zip'"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.zip --repo "${{ github.repository }}" --generate-notes --title "${{ github.ref_name }}"
